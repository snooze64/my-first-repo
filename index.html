<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Todo App</h1>
      <form id="todo-form" class="todo-form">
        <label for="todo-input" class="sr-only">新しいタスク</label>
        <input id="todo-input" type="text" placeholder="やることを入力" required />
        <button type="submit">追加</button>
      </form>

      <section class="toolbar" aria-label="フィルター">
        <button type="button" data-filter="all" class="active">すべて</button>
        <button type="button" data-filter="active">未完了</button>
        <button type="button" data-filter="completed">完了</button>
      </section>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <footer class="footer">
        <span id="todo-count">0件の未完了タスク</span>
        <button id="clear-completed" type="button">完了済みを削除</button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
